<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Shift Calendar header</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 823px; overflow: hidden; }
  body {
    font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(900px 600px at 78% 40%, rgba(10,180,255,0.28), transparent 70%),
      radial-gradient(700px 500px at 18% 90%, rgba(255,159,10,0.22), transparent 70%),
      linear-gradient(135deg, #04070d 0%, #0b1424 55%, #0a1a3a 100%);
    color: #fff; position: relative;
  }
  /* sọc chéo công nghiệp mờ như logo */
  body::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 36px, transparent 36px 72px);
  }
  .left { position: absolute; left: 150px; top: 50%; transform: translateY(-50%); width: 820px; }
  .icon { width: 190px; height: 190px; border-radius: 44px; box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.08); }
  h1 { font-size: 104px; font-weight: 800; letter-spacing: -3px; margin-top: 36px; line-height: 1; }
  h1 span { color: #0AB4FF; }
  .tag { font-size: 40px; color: rgba(255,255,255,0.78); margin-top: 22px; font-weight: 500; }
  .chips { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
  .chip { font-size: 26px; font-weight: 600; padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); }

  .phone {
    position: absolute; right: 190px; top: 70px; width: 470px; height: 900px; border-radius: 72px;
    background: #000; border: 12px solid #1c1c1e; box-shadow: 0 40px 120px rgba(0,0,0,0.7), 0 0 0 2px rgba(255,255,255,0.06);
    padding: 70px 26px 0; transform: rotate(-4deg);
  }
  .notch { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 130px; height: 36px; border-radius: 20px; background: #000; border: 2px solid #1c1c1e; }
  .ptitle { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  .psub { font-size: 18px; color: #0AB4FF; font-weight: 600; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: #1c1c1e; border-radius: 22px; padding: 12px 10px; margin-top: 14px; }
  .wd { font-size: 13px; text-align: center; color: rgba(235,235,245,0.6); font-weight: 600; padding-bottom: 4px; }
  .wd.we { color: #FF9F0A; }
  .c { height: 64px; border-radius: 11px; position: relative; padding-top: 6px; text-align: center; font-size: 19px; font-weight: 600; }
  .c i { position: absolute; left: 4px; right: 4px; bottom: 5px; height: 15px; border-radius: 5px; font-style: normal; font-size: 11px; font-weight: 800; line-height: 15px; }
  .S { background: rgba(255,214,10,0.24); } .S i { background: #FFD60A; color: #1c1c1e; }
  .C { background: rgba(255,159,10,0.24); } .C i { background: #FF9F0A; color: #1c1c1e; }
  .D { background: #101C4A; } .D i { background: #5E5CE6; color: #fff; }
  .P { background: rgba(191,90,242,0.26); } .P i { background: #BF5AF2; color: #fff; }
  .O i { background: #8E8E93; color: #fff; }
  .today span { display: inline-block; width: 30px; height: 30px; border-radius: 50%; background: #FF453A; line-height: 30px; }
  .card { margin-top: 16px; border-radius: 20px; padding: 16px 18px; background: linear-gradient(135deg, #30D158, #0A9F6E); }
  .card b { display: block; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .card small { font-size: 15px; opacity: 0.9; font-weight: 700; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="left">
    <img class="icon" src="../../../assets/icon.png" alt="">
    <h1>Shift <span>Calendar</span></h1>
    <div class="tag">Lịch ca · Âm lịch · Báo thức · Tính lương</div>
    <div class="chips">
      <div class="chip">☀️ Ca ngày</div><div class="chip">🌙 Ca đêm</div><div class="chip">⏰ Báo thức đi ca</div><div class="chip">💰 Lương & OT</div>
    </div>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="psub">2026 · Bính Ngọ</div>
    <div class="ptitle">Tháng 10</div>
    <div class="grid" id="g"></div>
    <div class="card"><small>TỔNG LƯƠNG</small><b>9.240.000đ</b></div>
  </div>

<script>
  const g = document.getElementById('g');
  ['T2','T3','T4','T5','T6','T7','CN'].forEach((w, i) => g.insertAdjacentHTML('beforeend', `<div class="wd ${i > 4 ? 'we' : ''}">${w}</div>`));
  for (let i = 0; i < 3; i++) g.insertAdjacentHTML('beforeend', '<div></div>');
  const cyc = ['S','S','C','C','D','D','O','O'];
  for (let d = 1; d <= 31; d++) {
    let k = cyc[(d + 1) % 8];
    if (d === 26 || d === 27) k = 'P';
    const label = { S: 'S', C: 'C', D: 'Đ', O: 'O', P: 'P' }[k];
    const num = d === 23 ? '<span>23</span>' : d;
    g.insertAdjacentHTML('beforeend', `<div class="c ${k} ${d === 23 ? 'today' : ''}">${num}<i>${label}</i></div>`);
  }
</script>
</body>
</html>
